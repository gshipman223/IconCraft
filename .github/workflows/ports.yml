name: Linux and Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/*.test.cjs
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: bash scripts/build_ports.sh
      - run: bash scripts/package_linux.sh
      - name: Disposable self-test
        run: build/iconcraft-linux-amd64 --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.deb
            dist/linux/IconCraft.AppDir
          if-no-files-found: warn
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Build the Windows exe
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -o build/iconcraft.exe ./cmd/iconcraft
      - name: Disposable self-test
        shell: pwsh
        run: .\build\iconcraft.exe --self-test
      - name: Zip the unsigned build
        shell: pwsh
        run: ./scripts/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/windows/*.zip
          if-no-files-found: warn
